<!doctype html>
<html>
	<head>
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<link rel="stylesheet" href="checkout.css" />
		<title>Checkout</title>
	</head>
	<body>
		<form class="form" action="checkout.html" method="post">
			<div>
				<label for="name">Ime:</label>
				<input
					type="text"
					placeholder="Unesite vase ime"
					id="name"
					name="name"
					required
				/><br />
			</div>

			<div>
				<label for="address">Adresa:</label>
				<input
					type="text"
					placeholder="Unesite vasu adresu"
					id="address"
					name="address"
					required
				/><br />
			</div>

			<div>
				<label for="email">Imejl:</label>
				<input
					type="email"
					placeholder="Unesite vas email"
					id="email"
					name="email"
					required
				/><br /><br />
			</div>
			<div>
				<label for="city">Grad:</label>
				<select id="city" name="city" required>
					<option value="" disabled selected>Izaberite grad</option>
					<option value="beograd">Beograd</option>
					<option value="novi_sad">Novi Sad</option>
				</select>
			</div>
			<div>
				Odaberite nacin placanja:<br />
				<input
					type="radio"
					id="kreditna"
					name="nacin_placanja"
					value="kreditna"
					required
				/>
				<label for="kreditna">Kreditna kartica</label><br />
				<input
					type="radio"
					id="pouzecem"
					name="nacin_placanja"
					value="pouzecem"
					required
				/>
				<label for="pouzecem">Pouzecem</label><br />
			</div>
			<div>
				<input type="checkbox" id="subskripcija" name="subskripcija" />
				<label for="subskripcija"
					>Da li zelite da se prijavite za newsletter?</label
				><br />
			</div>
			<input type="submit" value="Potvrdi porudzbinu" />
		</form>
	</body>
</html>
