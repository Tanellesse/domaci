<!doctype html>
<html>
	<head>
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<link rel="stylesheet" href="css/bootstrap.min.css" />
		<link rel="stylesheet" href="style.css" />
		<script src="js/bootstrap.min.js"></script>
	</head>
	<body>
		<div id="carouselExampleCaptions" class="carousel slide">
			<div class="carousel-indicators">
				<button
					type="button"
					data-bs-target="#carouselExampleCaptions"
					data-bs-slide-to="0"
					class="active"
					aria-current="true"
					aria-label="Slide 1"
				></button>
				<button
					type="button"
					data-bs-target="#carouselExampleCaptions"
					data-bs-slide-to="1"
					aria-label="Slide 2"
				></button>
				<button
					type="button"
					data-bs-target="#carouselExampleCaptions"
					data-bs-slide-to="2"
					aria-label="Slide 3"
				></button>
			</div>
			<div class="carousel-inner">
				<div class="carousel-item active">
					<img src="slike/lambo.webp" class="d-block w-100" alt="..." />
					<div class="carousel-caption d-none d-md-block"></div>
				</div>
				<div class="carousel-item">
					<img src="slike/lambordzini.jpg" class="d-block w-100" alt="..." />
					<div class="carousel-caption d-none d-md-block"></div>
				</div>
				<div class="carousel-item">
					<img src="slike/lamborghini.jpg" class="d-block w-100" alt="..." />
					<div class="carousel-caption d-none d-md-block"></div>
				</div>
			</div>
			<button
				class="carousel-control-prev"
				type="button"
				data-bs-target="#carouselExampleCaptions"
				data-bs-slide="prev"
			>
				<span class="carousel-control-prev-icon" aria-hidden="true"></span>
				<span class="visually-hidden">Previous</span>
			</button>
			<button
				class="carousel-control-next"
				type="button"
				data-bs-target="#carouselExampleCaptions"
				data-bs-slide="next"
			>
				<span class="carousel-control-next-icon" aria-hidden="true"></span>
				<span class="visually-hidden">Next</span>
			</button>
		</div>

		<section class="container text-center d-flex flex-wrap mt-5">
			<article
				class="col-10 d-flex flex-column justify-content-center align-items-center bg-dark text-light"
			>
				Veoma interesantan blok
				<button
					type="button"
					class="btn btn-primary mt2"
					data-bs-toggle="modal"
					data-bs-target="#exampleModal"
				>
					Interesantno dugme
				</button>
			</article>
			<article
				class="col-5 d-flex justify-content-center align-items-center bg-primary text-light"
			>
				Druga zanimljiva stavka
			</article>
			<article
				class="col-5 d-flex justify-content-center align-items-center bg-info text-light"
			>
				Treci bitan faktor
			</article>
			<article
				class="col-10 d-flex justify-content-center align-items-center bg-dark text-light"
			>
				Četvrto vazno pravilo
			</article>
		</section>

		<footer class="bg-body-tertiary text-center text-lg-start mt-5">
			<p class="text-center p-4 bg-dark text-light">© Moj sajt 2026</p>
		</footer>

		<div
			class="modal fade"
			id="exampleModal"
			tabindex="-1"
			aria-labelledby="exampleModalLabel"
			aria-hidden="true"
		>
			<div class="modal-dialog">
				<div class="modal-content">
					<div class="modal-header">
						<h1 class="modal-title fs-5" id="exampleModalLabel">Modal title</h1>
						<button
							type="button"
							class="btn-close"
							data-bs-dismiss="modal"
							aria-label="Close"
						></button>
					</div>
					<div class="modal-body">
						Ako vam se svidja ovaj blok, kliknite na dugme "Svidja mi se" ispod!
					</div>
					<div class="modal-footer">
						<button
							type="button"
							class="btn btn-secondary"
							data-bs-dismiss="modal"
						>
							Close
						</button>
						<button type="button" class="btn btn-primary">Svidja mi se</button>
					</div>
				</div>
			</div>
		</div>
	</body>
</html>
